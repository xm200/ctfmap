services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ctfmap
      POSTGRES_USER: ctfmap
      POSTGRES_PASSWORD: ctfmap_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctfmap -d ctfmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://ctfmap:ctfmap_dev_password@db:5432/ctfmap
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
