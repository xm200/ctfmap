services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ctfmap
      POSTGRES_PASSWORD: ctfmap
      POSTGRES_DB: ctfmap
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build: .
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ctfmap:ctfmap@db:5432/ctfmap
      DATABASE_URL_SYNC: postgresql+psycopg2://ctfmap:ctfmap@db:5432/ctfmap
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PARSER_API_TOKEN: ${PARSER_API_TOKEN:-changeme}
    depends_on:
      - db
    networks:
      - internal
      - external

  scraper:
    build: ./parser
    environment:
      API_URL: http://api:8000
      API_TOKEN: ${PARSER_API_TOKEN:-changeme}
      CTFTIME_PROXY: ${CTFTIME_PROXY:-}
    depends_on:
      - api
    networks:
      - internal
      - external
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Браузер обращается к API через тот же origin, а Vite проксирует запрос
      # внутри docker-сети. Это работает и с localhost, и при входе по IP.
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    networks:
      - external


networks:
  internal:

  external:
    driver: bridge

volumes:
  pgdata:
